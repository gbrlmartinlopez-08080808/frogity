name: Android build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      # Optional: sign with your own upload key (add the four secrets described in PUBLISHING.md)
      - name: Prepare signing key
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > android/upload.jks
          cat > android/keystore.properties <<PROPS
          storeFile=../upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS
      - name: Build signed release
        if: env.KS_B64 != ''
        env:
          FROGITY_REQUIRE_SIGNING: 'true'
        run: cd android && ./gradlew assembleRelease bundleRelease --no-daemon
      # No upload key configured: sign with a sideload key that is created once and kept in the repository's private Actions cache
      # (never committed), so every APK built here carries the SAME signature and installs over the previous one as an update.
      # Play uploads use the ANDROID_KEYSTORE_* secrets above instead.
      - name: Restore the sideload signing key
        if: env.KS_B64 == ''
        uses: actions/cache@v4
        with:
          path: android/sideload-key
          key: frogity-sideload-key-v1
      - name: Build sideload APK (stable signature)
        if: env.KS_B64 == ''
        run: |
          mkdir -p android/sideload-key
          if [ ! -f android/sideload-key/frogity.keystore ]; then
            openssl rand -hex 16 > android/sideload-key/pass
            keytool -genkeypair -keystore android/sideload-key/frogity.keystore -alias frogity -keyalg RSA -keysize 2048 -validity 36500 -storepass "$(cat android/sideload-key/pass)" -keypass "$(cat android/sideload-key/pass)" -dname "CN=Frogity, O=Frogity, C=ES"
            echo "A NEW sideload key was created (no cached key found): this APK will not install over one signed by an earlier key."
          fi
          cat > android/keystore.properties <<PROPS
          storeFile=../sideload-key/frogity.keystore
          storePassword=$(cat android/sideload-key/pass)
          keyAlias=frogity
          keyPassword=$(cat android/sideload-key/pass)
          PROPS
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Keep the APK in the repository (releases/)
        if: github.ref_type == 'branch'
        run: |
          V=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          keytool -printcert -jarfile "$APK" | grep -E "Owner|SHA256" || true
          git config user.name "frogity-build"
          git config user.email "build@users.noreply.github.com"
          git rm -q --ignore-unmatch releases/*.apk
          mkdir -p releases && cp "$APK" "releases/Frogity-$V.apk"
          git add -f "releases/Frogity-$V.apk"
          git diff --cached --quiet || (git commit -m "Frogity $V APK [skip ci]" && for i in 1 2 3; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done)
      - uses: actions/upload-artifact@v4
        with:
          name: Frogity-android
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/release/app-release.aab
